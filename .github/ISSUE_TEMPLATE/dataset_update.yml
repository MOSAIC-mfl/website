name: Dataset catalogue update
description: Add a new dataset or update an existing catalogue entry
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        The catalogue records live in [MOSAIC-mfl/catalog](https://github.com/MOSAIC-mfl/catalog)
        (`records/<ID>/record.yaml`); the website reads them through the MOSAIC API. You can also
        use the "Register a new dataset" form there. A maintainer moves this request to the record.
  - type: dropdown
    id: action
    attributes:
      label: Action
      options: ["Add new dataset", "Update existing dataset", "Remove dataset"]
    validations:
      required: true
  - type: input
    id: dataset_id
    attributes:
      label: Dataset ID
      placeholder: "e.g. MFL-2026-079"
  - type: input
    id: title
    attributes:
      label: Dataset title
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
  - type: input
    id: landscape
    attributes:
      label: Living Landscape code
  - type: textarea
    id: changes
    attributes:
      label: What needs to change?
    validations:
      required: true
