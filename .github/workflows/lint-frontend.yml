# .github/workflows/lint-frontend.yml
# Every pull request and every push to main: the generated API types match the committed contract,
# lint, type check, tests and a production build.
name: Lint Frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node version: .nvmrc (22.23.4, Astro 7.4.7's engines.node floor), read by both workflows.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types match the contract
        run: npm run gen:api && git diff --exit-code src/lib/api

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Added 2026-10-30 with the Astro 7 upgrade: `eslint src` covers only .ts/.tsx and
      # `tsc --noEmit` does not read .astro files, so a pull request must also check and build them.
      - name: Astro check
        run: npm run check

      - name: Build Astro site
        run: npm run build
