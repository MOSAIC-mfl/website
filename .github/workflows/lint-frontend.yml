# .github/workflows/lint-frontend.yml
name: Lint Frontend

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node pinned to Astro 7.4.7's engines.node floor (>=22.23.4). This value is stated in
      # three places — .nvmrc, deploy-pages.yml and this file — and they must agree.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check
        run: npm run typecheck
        working-directory: frontend

      # Added 2026-10-30 with the Astro 7 upgrade. Before these two steps existed, no pull
      # request ever built the site — deploy-pages.yml runs only on push to main — and nothing
      # checked the 27 .astro files at all, because `eslint src` covers only .ts/.tsx and
      # `tsc --noEmit` does not read .astro. A PR could be fully green with a broken build.
      - name: Astro check
        run: npm run check
        working-directory: frontend

      - name: Build Astro site
        run: npm run build
        working-directory: frontend
