# .github/workflows/deploy-pages.yml
# Build the website (frontend/) and publish it on GitHub Pages: https://mosaic-mfl.github.io/website/
# The site has no catalogue data inside: it reads mosaic-api (static JSON on Pages) when a page
# opens, so it only needs rebuilding when the website code changes, not when the catalogue does.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLIC_MOSAIC_API_MODE: static
  PUBLIC_MOSAIC_API_URL: https://mosaic-mfl.github.io/mosaic-api
  MOSAIC_SITE_URL: https://mosaic-mfl.github.io
  MOSAIC_SITE_BASE: /website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node version: .nvmrc (22.23.4, Astro 7.4.7's engines.node floor), read by both workflows.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Astro site
        run: npm run build
        working-directory: frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
